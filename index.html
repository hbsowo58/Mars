<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mars Rover</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
            color: #fff;
        }

        .container {
            background: rgba(20, 20, 40, 0.9);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37),
                        0 0 20px rgba(255, 107, 107, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
        }

        h1 {
            text-align: center;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #FF6B6B, #FFD93D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .input-section {
            display: flex;
            gap: 12px;
            margin: 30px 0;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        label {
            color: #FFD93D;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid rgba(255, 107, 107, 0.3);
            border-radius: 10px;
            width: 100px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #FF6B6B;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
            background: rgba(255, 255, 255, 0.1);
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #FF6B6B, #FF8E8E);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        .game-area {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 40px;
            align-items: flex-start;
            min-height: 300px;
        }

        #mapContainer {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fuel-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
        }

        .fuel-label {
            font-size: 16px;
            font-weight: 700;
            color: #FFD93D;
            text-align: center;
            letter-spacing: 1px;
        }

        .fuel-gauge {
            width: 60px;
            height: 250px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 107, 107, 0.3);
            border-radius: 15px;
            padding: 8px;
            display: flex;
            flex-direction: column-reverse;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.1);
        }

        .fuel-bar {
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, #FFD93D, #FF6B6B);
            border-radius: 10px;
            transition: height 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 217, 61, 0.5);
        }

        .fuel-value {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #FFD93D;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .grid {
            display: inline-grid;
            gap: 3px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 2px solid rgba(255, 107, 107, 0.2);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.1);
        }

        .cell {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .cell-0 {
            background: linear-gradient(135deg, #4CAF50, #66BB6A);
            color: white;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }

        .cell-0-unvisited {
            background: linear-gradient(135deg, #2196F3, #42A5F5);
            color: white;
            box-shadow: 0 0 5px rgba(33, 150, 243, 0.3);
        }

        .cell-unreachable {
            background: linear-gradient(135deg, #999999, #CCCCCC);
            color: #555;
            box-shadow: 0 0 5px rgba(200, 200, 200, 0.3);
            opacity: 0.7;
        }

        .cell-0:hover {
            transform: scale(1.05);
        }

        .cell-0-unvisited:hover {
            transform: scale(1.05);
        }

        .cell-unreachable:hover {
            cursor: not-allowed;
        }

        .cell-1 {
            background: linear-gradient(135deg, #FF6B6B, #FF5252);
            color: white;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.4);
        }

        .cell-rover {
            background: linear-gradient(135deg, #FFD93D, #FFC107);
            color: #333;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(255, 217, 61, 0.6);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(255, 217, 61, 0.6);
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 0 25px rgba(255, 217, 61, 0.8);
            }
        }

        #statusMessage {
            margin-top: 25px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            height: 30px;
            color: #FFD93D;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 217, 61, 0.5);
        }

        .instructions {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 107, 107, 0.05);
            border-left: 4px solid #FF6B6B;
            border-radius: 10px;
            font-size: 13px;
            color: #b0b0b0;
            line-height: 1.8;
        }

        .instructions strong {
            color: #FFD93D;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 MARS ROVER</h1>
        <p class="subtitle">Red Planet Exploration System</p>

        <div class="input-section">
            <label>Height:</label>
            <input type="number" id="heightInput" value="8" min="3" max="15">
            <label>Width:</label>
            <input type="number" id="widthInput" value="8" min="3" max="15">
            <button onclick="initMap()">탐사 시작</button>
        </div>

        <div class="game-area">
            <div id="mapContainer"></div>
            <div class="fuel-section">
                <div class="fuel-label">⛽ FUEL</div>
                <div class="fuel-gauge">
                    <div class="fuel-bar" id="fuelBar"></div>
                </div>
                <div class="fuel-value" id="fuelValue">0/100</div>
            </div>
        </div>

        <div id="statusMessage"></div>

        <div style="margin-top: 20px; text-align: center;">
            <div id="explorationInfo" style="font-size: 16px; font-weight: bold; color: #4CAF50; margin-bottom: 10px;"></div>
            <div id="explorationProgress" style="font-size: 14px; color: #FFD93D; margin-bottom: 10px;"></div>
        </div>

        <div style="margin-top: 20px; text-align: center; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <button onclick="checkDuplicateVisit()" style="background: linear-gradient(135deg, #4CAF50, #66BB6A);">🔍 중복 방문 확인</button>
            <button onclick="optimizePath()" id="optimizeBtn" style="background: linear-gradient(135deg, #FFD93D, #FFC107); opacity: 0.5; cursor: not-allowed;">⚡ 최적화 경로</button>
        </div>
        <div id="duplicateStatus" style="margin-top: 10px; font-size: 16px; font-weight: bold; color: #FFD93D; text-align: center;"></div>

        <div class="instructions">
            <strong>🎮 조작 방법:</strong><br>
            ⬆️ 위쪽 화살표 또는 W - 위로 이동<br>
            ⬇️ 아래쪽 화살표 또는 S - 아래로 이동<br>
            ⬅️ 왼쪽 화살표 또는 A - 왼쪽으로 이동<br>
            ➡️ 오른쪽 화살표 또는 D - 오른쪽으로 이동
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;

        let gameGrid = [];
        let roverPos = { y: 1, x: 1 };
        let mapWidth = 0;
        let pollingInterval = null;
        let isInitialized = false;
        let hasDuplicates = false;
        let visitedSet = new Set();
        let reachableCells = new Set();
        let totalWalkableCells = 0;
        let explorationProgress = 0;
        let isExplorationComplete = false;
        let isExplorationFailed = false;

        async function initMap() {
            const height = parseInt(document.getElementById('heightInput').value);
            const width = parseInt(document.getElementById('widthInput').value);

            if (!height || !width || height < 3 || width < 3) {
                alert('3 이상의 Height와 Width를 입력해주세요.');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/init`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ height, width })
                });

                const data = await response.json();
                gameGrid = data.grid;
                roverPos = data.rover;
                mapWidth = width;
                isInitialized = true;
                totalWalkableCells = data.total_walkable_cells;
                explorationProgress = data.exploration_progress;
                visitedSet = new Set(data.visited.map(v => `${v[0]},${v[1]}`));
                reachableCells = new Set(data.reachable_cells.map(c => `${c[0]},${c[1]}`));

                renderMap(gameGrid, mapWidth, roverPos);
                updateFuelGauge(data.fuel);
                updateExplorationInfo();
                document.getElementById('statusMessage').textContent = '탐사 시작!';

                if (pollingInterval) clearInterval(pollingInterval);
                pollingInterval = setInterval(pollStatus, 500);
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function pollStatus() {
            if (!isInitialized || !gameGrid || gameGrid.length === 0) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/status`);
                const data = await response.json();

                if (data.grid && data.grid.length > 0) {
                    gameGrid = data.grid;
                    roverPos = data.rover;
                    hasDuplicates = data.has_duplicates;
                    explorationProgress = data.exploration_progress;
                    isExplorationComplete = data.is_exploration_complete;
                    isExplorationFailed = data.is_exploration_failed;
                    visitedSet = new Set(data.visited.map(v => `${v[0]},${v[1]}`));
                    reachableCells = new Set(data.reachable_cells.map(c => `${c[0]},${c[1]}`));

                    renderMap(gameGrid, mapWidth, roverPos);
                    updateFuelGauge(data.fuel);
                    updateExplorationInfo();
                    document.getElementById('statusMessage').textContent = data.message;

                    if (isExplorationComplete) {
                        document.getElementById('statusMessage').textContent = '🎉 탐사 성공!';
                        document.getElementById('explorationProgress').style.color = '#4CAF50';
                    } else if (isExplorationFailed) {
                        document.getElementById('statusMessage').textContent = '❌ 탐사 실패! 연료 부족';
                        document.getElementById('explorationProgress').style.color = '#FF6B6B';
                    }

                    if (hasDuplicates) {
                        document.getElementById('optimizeBtn').style.opacity = '1';
                        document.getElementById('optimizeBtn').style.cursor = 'pointer';
                    }
                }
            } catch (error) {
                console.error('Polling error:', error);
            }
        }

        function updateExplorationInfo() {
            const visitedCount = visitedSet.size;
            document.getElementById('explorationInfo').textContent = `탐사 목표: ${totalWalkableCells}개 셀`;
            document.getElementById('explorationProgress').textContent = `탐사: ${visitedCount}/${totalWalkableCells} (${explorationProgress}%)`;
        }

        function checkDuplicateVisit() {
            const statusDiv = document.getElementById('duplicateStatus');
            if (hasDuplicates) {
                statusDiv.textContent = '중복 방문 감지됨 ⚠️';
                statusDiv.style.color = '#FF6B6B';
                document.getElementById('optimizeBtn').style.opacity = '1';
                document.getElementById('optimizeBtn').style.cursor = 'pointer';
            } else {
                statusDiv.textContent = '중복 방문 없음 ✅';
                statusDiv.style.color = '#4CAF50';
                document.getElementById('optimizeBtn').style.opacity = '0.5';
                document.getElementById('optimizeBtn').style.cursor = 'not-allowed';
            }
        }

        async function optimizePath() {
            if (!hasDuplicates) {
                alert('중복 방문이 없어서 최적화가 필요하지 않습니다.');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/optimize`);
                const data = await response.json();

                document.getElementById('statusMessage').textContent = '최적 경로 실행 중...';

                for (const command of data.commands) {
                    await moveRoverAuto(command);
                    await sleep(100);
                }

                document.getElementById('statusMessage').textContent = '최적 경로 실행 완료! 🎉';
            } catch (error) {
                document.getElementById('statusMessage').textContent = 'Error: ' + error.message;
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function moveRoverAuto(direction) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/move`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ direction })
                });

                const data = await response.json();
                roverPos = data.rover;
                hasDuplicates = data.has_duplicates;
                visitedSet = new Set(data.visited.map(v => `${v[0]},${v[1]}`));
                reachableCells = new Set(data.reachable_cells.map(c => `${c[0]},${c[1]}`));
                renderMap(gameGrid, mapWidth, roverPos);
                updateFuelGauge(data.fuel);
            } catch (error) {
                console.error('Move error:', error);
            }
        }

        function updateFuelGauge(fuelUsed) {
            const fuelBar = document.getElementById('fuelBar');
            const fuelValue = document.getElementById('fuelValue');
            const remainingFuel = 100 - fuelUsed;

            fuelBar.style.height = (remainingFuel / 100) * 100 + '%';
            fuelValue.textContent = remainingFuel + '/100';
        }

        function renderMap(grid, width, rover) {
            const container = document.getElementById('mapContainer');
            container.innerHTML = '';

            const gridDiv = document.createElement('div');
            gridDiv.className = 'grid';
            gridDiv.style.gridTemplateColumns = `repeat(${width}, 1fr)`;

            grid.forEach((row, y) => {
                row.forEach((cell, x) => {
                    const cellDiv = document.createElement('div');
                    const cellKey = `${y},${x}`;

                    if (y === rover.y && x === rover.x) {
                        cellDiv.className = 'cell cell-rover';
                        cellDiv.textContent = '🚀';
                    } else if (cell === 0) {
                        if (visitedSet.has(cellKey)) {
                            cellDiv.className = 'cell cell-0';
                            cellDiv.textContent = '✅';
                        } else if (reachableCells.has(cellKey)) {
                            cellDiv.className = 'cell cell-0-unvisited';
                            cellDiv.textContent = '🎯';
                        } else {
                            cellDiv.className = 'cell cell-unreachable';
                            cellDiv.textContent = '⛔';
                        }
                    } else {
                        cellDiv.className = `cell cell-${cell}`;
                        cellDiv.textContent = '';
                    }

                    gridDiv.appendChild(cellDiv);
                });
            });

            container.appendChild(gridDiv);
        }

        async function moveRover(direction) {
            if (!gameGrid || gameGrid.length === 0) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/move`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ direction })
                });

                const data = await response.json();
                roverPos = data.rover;
                hasDuplicates = data.has_duplicates;
                explorationProgress = data.exploration_progress;
                isExplorationComplete = data.is_exploration_complete;
                isExplorationFailed = data.is_exploration_failed;
                visitedSet = new Set(data.visited.map(v => `${v[0]},${v[1]}`));
                reachableCells = new Set(data.reachable_cells.map(c => `${c[0]},${c[1]}`));

                renderMap(gameGrid, mapWidth, roverPos);
                updateFuelGauge(data.fuel);
                updateExplorationInfo();
                document.getElementById('statusMessage').textContent = data.message;

                if (isExplorationComplete) {
                    document.getElementById('statusMessage').textContent = '🎉 탐사 성공!';
                    document.getElementById('explorationProgress').style.color = '#4CAF50';
                    alert(`🎉 탐사 성공!\n\n총 탐사 가능 셀: ${totalWalkableCells}개\n방문한 셀: ${visitedSet.size}개\n사용한 연료: ${data.fuel}/100`);
                } else if (isExplorationFailed) {
                    document.getElementById('statusMessage').textContent = '❌탐사 실패! 연료 부족';
                    document.getElementById('explorationProgress').style.color = '#FF6B6B';
                    alert(`❌ 탐사 실패! 연료 부족\n\n사용한 연료: ${data.fuel}/100`);
                }
            } catch (error) {
                document.getElementById('statusMessage').textContent = 'Error: ' + error.message;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                e.preventDefault();
                moveRover('up');
            } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                e.preventDefault();
                moveRover('down');
            } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                e.preventDefault();
                moveRover('left');
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                e.preventDefault();
                moveRover('right');
            }
        });
    </script>
</body>
</html>
